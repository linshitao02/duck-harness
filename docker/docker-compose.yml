name: duck-harness

services:
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8787:8787"
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      HARNESS_SECRET_KEY: ${HARNESS_SECRET_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      HARNESS_SQLITE_PATH: /data/harness.sqlite
      HARNESS_UPLOAD_DIR: /data/uploads
      HARNESS_WORKSPACE: /workspace
      AUTO_SEED: ${AUTO_SEED:-true}
      ENABLE_SCHEDULER: ${ENABLE_SCHEDULER:-true}
    volumes:
      - duck-data:/data
      - ${HARNESS_WORKSPACE_HOST:-duck-workspace}:/workspace
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  duck-data:
  duck-workspace:
